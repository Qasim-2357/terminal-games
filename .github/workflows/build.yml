name: Build

on:
  push:
  pull_request:

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os:
          - windows-latest
          - ubuntu-latest
          - macos-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Configure CMake
        run: cmake -S . -B build -DCMAKE_CXX_STANDARD=17 -DCMAKE_CXX_STANDARD_REQUIRED=ON

      - name: Build terminal_games
        run: cmake --build build --config Release --target terminal_games

      - name: Upload terminal_games
        uses: actions/upload-artifact@v4
        with:
          name: terminal-games-${{ matrix.os == 'windows-latest' && 'windows' || matrix.os == 'ubuntu-latest' && 'linux' || 'macos' }}
          path: ${{ matrix.os == 'windows-latest' && 'build/Release/terminal_games.exe' || 'build/terminal_games' }}
